name: generate animation
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
    - main
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gustaaxz
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3b82f6&color_dots=#000000,#cbd5e1,#94a3b8,#64748b,#475569
            dist/github-contribution-grid-snake-dark.svg?color_snake=#10b981&color_dots=#000000,#1e293b,#334155,#475569,#64748b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
